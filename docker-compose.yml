services:
  floci:
    image: floci/floci:2.3.0
    container_name: floci
    ports:
      - "4566:4566"            # API de AWS
      - "7001-7099:7001-7099"  # PostgreSQL (RDS)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_SERVICES_DOCKER_NETWORK: conciliacion-batch
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: floci
    networks:
      - conciliacion-batch

networks:
  conciliacion-batch:
    name: conciliacion-batch
