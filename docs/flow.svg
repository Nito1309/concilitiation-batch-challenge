<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1120" height="660" fill="#fbfbfd"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6570"/></marker></defs>
<text x="40" y="40" font-size="19" font-weight="600" fill="#1f2328">conciliacion-batch — what `infra/` builds</text>
<text x="40" y="62" font-size="12.5" fill="#5b6570">three ways in, one task, one report per run · grey box is the platform that already existed</text>
<rect x="40" y="80" width="210" height="86" rx="9" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.6"/>
<rect x="40" y="80" width="4" height="86" rx="2" fill="#1a5fb4"/>
<text x="56" y="104" font-size="13.5" font-weight="600" fill="#1f2328">EventBridge Scheduler</text>
<text x="56" y="125" font-size="11.5" fill="#424a53">cron(0 5 * * ? *)</text>
<text x="56" y="142" font-size="11.5" fill="#424a53">America/Mexico_City</text>
<text x="56" y="159" font-size="11.5" fill="#424a53">retry 3 × 1 h</text>
<rect x="40" y="206" width="210" height="86" rx="9" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.6"/>
<rect x="40" y="206" width="4" height="86" rx="2" fill="#1a5fb4"/>
<text x="56" y="230" font-size="13.5" font-weight="600" fill="#1f2328">AWS CLI</text>
<text x="56" y="251" font-size="11.5" fill="#424a53">lambda invoke</text>
<text x="56" y="268" font-size="11.5" fill="#424a53">--payload {"fecha_inicio": …}</text>
<rect x="40" y="332" width="210" height="86" rx="9" fill="#ffffff" stroke="#8a5a00" stroke-width="1.6"/>
<rect x="40" y="332" width="4" height="86" rx="2" fill="#8a5a00"/>
<text x="56" y="356" font-size="13.5" font-weight="600" fill="#1f2328">S3</text>
<text x="56" y="377" font-size="11.5" fill="#424a53">s3://&lt;bucket&gt;/inbox/*</text>
<text x="56" y="394" font-size="11.5" fill="#424a53">ObjectCreated</text>
<rect x="350" y="186" width="230" height="126" rx="9" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.6"/>
<rect x="350" y="186" width="4" height="126" rx="2" fill="#1a5fb4"/>
<text x="366" y="210" font-size="13.5" font-weight="600" fill="#1f2328">dispatcher (Lambda)</text>
<text x="366" y="231" font-size="11.5" fill="#424a53">trigger → RUN_MODE</text>
<text x="366" y="248" font-size="11.5" fill="#424a53">+ variables</text>
<text x="366" y="265" font-size="11.5" fill="#424a53">stub: logs, no RunTask yet</text>
<rect x="690" y="172" width="220" height="154" rx="9" fill="#ffffff" stroke="#1b6e3c" stroke-width="1.6"/>
<rect x="690" y="172" width="4" height="154" rx="2" fill="#1b6e3c"/>
<text x="706" y="196" font-size="13.5" font-weight="600" fill="#1f2328">ECS Fargate task</text>
<text x="706" y="217" font-size="11.5" fill="#424a53">no service · RunTask</text>
<text x="706" y="234" font-size="11.5" fill="#424a53">private subnets</text>
<text x="706" y="251" font-size="11.5" fill="#424a53">conciliacion-batch-lab-app</text>
<rect x="950" y="96" width="150" height="86" rx="9" fill="#f2f3f5" stroke="#5b6570" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="950" y="96" width="4" height="86" rx="2" fill="#5b6570"/>
<text x="966" y="120" font-size="13.5" font-weight="600" fill="#1f2328">RDS Postgres</text>
<text x="966" y="141" font-size="11.5" fill="#424a53">created by</text>
<text x="966" y="158" font-size="11.5" fill="#424a53">bootstrap-floci</text>
<rect x="950" y="300" width="150" height="86" rx="9" fill="#ffffff" stroke="#8a5a00" stroke-width="1.6"/>
<rect x="950" y="300" width="4" height="86" rx="2" fill="#8a5a00"/>
<text x="966" y="324" font-size="13.5" font-weight="600" fill="#1f2328">S3 prefixes</text>
<text x="966" y="345" font-size="11.5" fill="#424a53">raw/ data/</text>
<text x="966" y="362" font-size="11.5" fill="#424a53">reports/ logs/</text>
<rect x="690" y="396" width="220" height="86" rx="9" fill="#ffffff" stroke="#a51d2d" stroke-width="1.6"/>
<rect x="690" y="396" width="4" height="86" rx="2" fill="#a51d2d"/>
<text x="706" y="420" font-size="13.5" font-weight="600" fill="#1f2328">EventBridge rule</text>
<text x="706" y="441" font-size="11.5" fill="#424a53">this cluster</text>
<text x="706" y="458" font-size="11.5" fill="#424a53">lastStatus = STOPPED</text>
<rect x="350" y="396" width="230" height="86" rx="9" fill="#ffffff" stroke="#a51d2d" stroke-width="1.6"/>
<rect x="350" y="396" width="4" height="86" rx="2" fill="#a51d2d"/>
<text x="366" y="420" font-size="13.5" font-weight="600" fill="#1f2328">notifier (Lambda)</text>
<text x="366" y="441" font-size="11.5" fill="#424a53">exitCode · stopCode</text>
<text x="366" y="458" font-size="11.5" fill="#424a53">stoppedReason → SES</text>
<rect x="40" y="396" width="210" height="86" rx="9" fill="#ffffff" stroke="#a51d2d" stroke-width="1.6"/>
<rect x="40" y="396" width="4" height="86" rx="2" fill="#a51d2d"/>
<text x="56" y="420" font-size="13.5" font-weight="600" fill="#1f2328">SES</text>
<text x="56" y="441" font-size="11.5" fill="#424a53">verified sender</text>
<text x="56" y="458" font-size="11.5" fill="#424a53">any run, ok or failed</text>
<rect x="350" y="540" width="230" height="70" rx="9" fill="#ffffff" stroke="#a51d2d" stroke-width="1.6"/>
<rect x="350" y="540" width="4" height="70" rx="2" fill="#a51d2d"/>
<text x="366" y="564" font-size="13.5" font-weight="600" fill="#1f2328">SQS queue</text>
<text x="366" y="585" font-size="11.5" fill="#424a53">failed async invocations</text>
<text x="366" y="602" font-size="11.5" fill="#424a53">wait here for a human</text>
<path d="M250,123 C300.0,123 300.0,216 350,216" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M250,249 L350,249" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M250,375 C300.0,375 300.0,282 350,282" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M580,249 L690,249" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<text x="635.0" y="242" font-size="11" fill="#5b6570" text-anchor="middle">RunTask</text>
<path d="M910,200 C930.0,200 930.0,165 950,165" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M910,300 C930.0,300 930.0,330 950,330" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M800,326 C800.0,326 800.0,396 800,396" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<text x="806" y="356.0" font-size="11" fill="#5b6570">task stops</text>
<path d="M690,439 L580,439" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M350,439 L250,439" fill="none" stroke="#5b6570" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M470,482 C470.0,482 470.0,540 470,540" fill="none" stroke="#5b6570" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="476" y="506.0" font-size="11" fill="#5b6570">on failure</text>
<text x="40" y="628" font-size="11.5" fill="#5b6570">Everything logs to CloudWatch (14 days). The scheduler also has its own SQS DLQ for ticks it cannot deliver (3.7).</text>
<text x="690" y="628" font-size="11.5" fill="#5b6570">Blue: triggers · green: the job · red: alerting · amber: storage</text>
</svg>
